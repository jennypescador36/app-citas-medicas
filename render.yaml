# Blueprint de Render: backend Quarkus (Docker) + PostgreSQL administrado.
# En Render: New > Blueprint > seleccionar este repositorio.
databases:
  - name: citas-db
    plan: free
    databaseName: bd_proyecto_salud
    user: citas_user

services:
  - type: web
    name: app-citas-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /hello
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: citas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: citas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: citas-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: citas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: citas-db
          property: password
