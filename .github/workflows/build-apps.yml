name: Build backend y apps moviles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # URL publica del backend en Render. Se puede cambiar en
  # GitHub > Settings > Secrets and variables > Actions > Variables > API_URL
  API_URL: ${{ vars.API_URL || 'https://app-citas-backend.onrender.com' }}

jobs:
  backend:
    name: Backend Quarkus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar
        run: mvn -B package -DskipTests

  android:
    name: APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_registro
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar APK
        run: flutter build apk --release --dart-define=API_URL=$API_URL
      - uses: actions/upload-artifact@v4
        with:
          name: citas-medicas-android-apk
          path: frontend_registro/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (sin firmar)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend_registro
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar iOS sin firma
        run: flutter build ios --release --no-codesign --dart-define=API_URL=$API_URL
      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr citas-medicas-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: citas-medicas-ios-ipa
          path: frontend_registro/citas-medicas-ios-unsigned.ipa
