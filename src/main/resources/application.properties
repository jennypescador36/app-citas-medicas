# Configuración de PostgreSQL (lee variables en Render o usa datos locales en tu PC)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:1234}
# DB_URL (JDBC completo) tiene prioridad; si no existe se arma con DB_HOST/DB_PORT/DB_NAME (Render Blueprint)
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bd_proyecto_salud}}

# Puerto y host HTTP dinámico para Cloud
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update

# CORS nativo de Quarkus (única fuente de cabeceras CORS)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

